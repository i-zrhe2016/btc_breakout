<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BTC Breakout · 趋势线识别参数</title>
  <style>
    :root{color-scheme:dark;--bg:#020617;--surface:#0b1120;--surface2:#111827;--border:#334155;--soft:#1e293b;--text:#f8fafc;--muted:#a8b4c7;--cyan:#22d3ee;--cyanSoft:rgba(34,211,238,.12);--green:#22c55e;--greenSoft:rgba(34,197,94,.12);--red:#f87171;--redSoft:rgba(248,113,113,.12);--amber:#fbbf24;--amberSoft:rgba(251,191,36,.12)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100dvh;background:radial-gradient(circle at 18% -10%,rgba(34,211,238,.08),transparent 32%),var(--bg);color:var(--text);font:16px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif}button,input,select,textarea{font:inherit}button,[role=button]{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid rgba(34,211,238,.6);outline-offset:2px}
    header{min-height:64px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--soft);background:rgba(2,6,23,.88)}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cyan);color:#001014;font-weight:900}.brand small{display:block;color:var(--muted);font-size:12px}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{min-height:44px;padding:8px 13px;display:inline-flex;align-items:center;color:var(--muted);text-decoration:none;border:1px solid var(--soft);border-radius:999px}nav a.active{color:var(--text);border-color:var(--cyan);background:var(--cyanSoft)}
    main{width:min(1040px,calc(100% - 28px));margin:30px auto 50px}.eyebrow{color:var(--cyan);font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:5px 0 6px;font-size:clamp(26px,4vw,40px)}.intro{margin:0 0 22px;color:var(--muted)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;align-items:start}.panel{background:linear-gradient(180deg,rgba(17,24,39,.98),rgba(11,17,32,.98));border:1px solid var(--soft);border-radius:14px;overflow:hidden}.head{padding:16px 18px 12px;border-bottom:1px solid var(--soft)}.head h2{font-size:17px;margin:0}.head p{font-size:12px;color:var(--muted);margin:3px 0 0}.body{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}input,select,textarea{width:100%;min-height:44px;padding:9px 11px;color:var(--text);background:#050b18;border:1px solid var(--border);border-radius:9px}textarea{min-height:82px;resize:vertical}.drop{min-height:260px;padding:20px;border:1px dashed #475569;border-radius:12px;display:grid;place-items:center;text-align:center;background:rgba(2,6,23,.72);cursor:pointer;overflow:hidden}.drop:hover,.drop.drag{border-color:var(--cyan);background:var(--cyanSoft)}.drop img{width:100%;max-height:360px;object-fit:contain}.drop small{display:block;color:var(--muted);margin-top:6px}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{min-height:44px;padding:9px 14px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-weight:650}button.primary{background:var(--cyan);color:#001014;border-color:transparent}button.secondary{background:var(--surface2);color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:13px;padding:11px 12px;border:1px solid var(--soft);border-radius:9px;color:var(--muted);white-space:pre-wrap}.status:empty{display:none}.status.ok{color:#bbf7d0;border-color:rgba(34,197,94,.5);background:var(--greenSoft)}.status.error{color:#fecaca;border-color:rgba(248,113,113,.5);background:var(--redSoft)}.status.info{color:#cffafe;border-color:rgba(34,211,238,.45);background:var(--cyanSoft)}.result{margin-top:14px;padding-top:14px;border-top:1px solid var(--soft)}.result h3{margin:0 0 10px;font-size:15px}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px}.field-state{display:block;margin-top:5px;color:var(--muted);font-size:11px}.field-state.ok{color:#bbf7d0}.field-state.warn{color:#fde68a}.saved{color:#fde68a;background:var(--amberSoft);border-left:3px solid var(--amber);padding:9px 11px;margin-top:12px;font-size:12px}
    @media(max-width:760px){header{padding:12px 14px;align-items:flex-start}.brand small{display:none}.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}main{margin-top:22px}.drop{min-height:210px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="mark" aria-hidden="true">B</div><div><strong>BTC Breakout</strong><small>Recognition Workspace</small></div></div><nav aria-label="主导航"><a href="/">策略</a><a class="active" href="/recognition">识别参数</a><a href="/preview">K线预览</a><a href="/settings">通知设置</a></nav></header>
  <main><div class="eyebrow">Recognition setup</div><h1>趋势线识别参数</h1><p class="intro">这里只负责截图与识别参数。周期校验通过后识别画线，结果可手动修改并发送到独立 K 线预览页。</p>
    <div class="layout">
      <section class="panel"><div class="head"><h2>识别设置</h2><p>默认读取左上角周期；手动选择时会严格校验</p></div><div class="body"><div class="grid">
        <div><label for="symbol">交易对</label><input id="symbol" value="BTCUSDT"></div><div><label for="timeframe">K线周期</label><select id="timeframe"><option value="auto" selected>自动识别（左上角）</option><option>1m</option><option>3m</option><option>5m</option><option>15m</option><option>30m</option><option>1h</option><option>2h</option><option>4h</option><option>6h</option><option>8h</option><option>12h</option><option>1d</option><option>3d</option><option>1w</option></select><small id="timeframeState" class="field-state warn">等待截图左上角周期</small></div>
        <div><label for="timezone">图表时区</label><select id="timezone"><option value="Asia/Shanghai" selected>UTC+8 北京时间</option><option value="UTC">UTC</option></select></div><div><label for="role">画线用途</label><select id="role"><option value="entry">入场线</option><option value="stop">止损线</option></select></div>
        <div class="full"><label for="expected">预期线型</label><select id="expected"><option value="auto">自动判断</option><option value="trendline">趋势线</option><option value="horizontal">水平线</option></select></div>
        <div class="full"><label for="hint">目标线提示</label><textarea id="hint" placeholder="例如：蓝色下降趋势线，连接两个明显高点"></textarea></div>
      </div><div class="saved">参数和识别结果保存在当前浏览器，不会跨设备同步。</div></div></section>
      <section class="panel"><div class="head"><h2>截图与结果</h2><p>Codex 优先读取截图左上角周期；支持点击、拖放或 Ctrl / Cmd + V</p></div><div class="body">
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="选择或粘贴图表截图"><div id="placeholder"><strong>选择或粘贴图表截图</strong><small>PNG / JPEG / WebP，最大 10 MB</small></div><img id="image" class="hidden" alt="待识别图表截图"></div><input id="file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp">
        <div class="actions"><button id="recognize" class="primary" disabled>先校验周期并识别</button><button id="clear" class="secondary" disabled>清除截图</button></div><div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="result" class="result hidden"><h3>识别结果 · 可手动调整 <span id="confidence" class="badge"></span></h3><div id="editor" class="grid"></div><div class="actions"><button id="savePreview" class="primary">保存并打开 K 线预览</button><a href="/preview" style="align-self:center;color:var(--cyan)">仅打开预览</a></div></div>
      </div></section>
    </div>
  </main>
  <script>
    const $=id=>document.getElementById(id),KEY="btcBreakoutRecognitionWorkspace",supportedTimeframes=new Set(["1m","3m","5m","15m","30m","1h","2h","4h","6h","8h","12h","1d","3d","1w"]);let imageData=null,line=null,geometry=null,detectedTimeframe=null,timeframeMode="auto";
    const box=(message,kind="")=>{$("status").textContent=message||"";$("status").className=`status ${kind}`.trim()};
    function workspace(){let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{}return saved}
    function setTimeframeState(message,kind=""){const el=$("timeframeState");el.textContent=message;el.className=`field-state ${kind}`.trim()}
    function persist(){const saved=workspace();saved.symbol=$("symbol").value.trim().toUpperCase();saved.timeframe=$("timeframe").value;saved.timeframe_mode=timeframeMode;saved.detected_timeframe=detectedTimeframe||null;saved.timezone=$("timezone").value;saved.lines=saved.lines||{};if(line)saved.lines[$("role").value]=line;localStorage.setItem(KEY,JSON.stringify(saved))}
    function loadDefaults(){const saved=workspace();if(saved.symbol)$("symbol").value=saved.symbol;if(saved.timeframe_mode==="auto"){timeframeMode="auto";$("timeframe").value="auto"}else if(saved.timeframe&&supportedTimeframes.has(saved.timeframe)){$("timeframe").value=saved.timeframe;timeframeMode="manual"}detectedTimeframe=supportedTimeframes.has(saved.detected_timeframe)?saved.detected_timeframe:null;if(timeframeMode==="auto"&&detectedTimeframe)setTimeframeState(`自动模式 · 上次识别 ${detectedTimeframe}`,"ok");else if(timeframeMode==="manual")setTimeframeState(`手动周期 · ${$("timeframe").value}`,"ok");if(saved.timezone)$("timezone").value=saved.timezone}
    function accept(file){if(!file||!["image/png","image/jpeg","image/webp"].includes(file.type))return box("仅支持 PNG、JPEG 或 WebP 图片","error");if(file.size>10*1024*1024)return box("截图不能超过 10MB","error");const reader=new FileReader();reader.onload=()=>{imageData=String(reader.result);$("image").src=imageData;$("image").classList.remove("hidden");$("placeholder").classList.add("hidden");$("recognize").disabled=false;$("clear").disabled=false;box("截图已就绪。下一步先检查 K 线周期。","info")};reader.readAsDataURL(file)}
    function renderEditor(){if(!line)return;const h=line.kind==="horizontal";$("editor").innerHTML=`<div class="full"><label for="kind">线型</label><select id="kind"><option value="trendline" ${!h?"selected":""}>趋势线</option><option value="horizontal" ${h?"selected":""}>水平线</option></select></div>${h?`<div class="full"><label for="price">价格</label><input id="price" type="number" step="0.01" value="${Number(line.price)}"></div>`:`<div><label for="ts1">锚点1时间 (Unix ms)</label><input id="ts1" type="number" value="${Number(line.ts1)}"></div><div><label for="p1">锚点1价格</label><input id="p1" type="number" step="0.01" value="${Number(line.price1)}"></div><div><label for="ts2">锚点2时间 (Unix ms)</label><input id="ts2" type="number" value="${Number(line.ts2)}"></div><div><label for="p2">锚点2价格</label><input id="p2" type="number" step="0.01" value="${Number(line.price2)}"></div>`}`;$("result").classList.remove("hidden");$("kind").onchange=e=>{const price=h?Number(line.price):Number(line.price2);line=e.target.value==="horizontal"?{kind:"horizontal",price}:{kind:"trendline",ts1:Date.now()-86400000,price1:price,ts2:Date.now(),price2:price};renderEditor()};$("editor").querySelectorAll("input").forEach(el=>el.oninput=()=>{if(line.kind==="horizontal")line.price=Number($("price").value);else Object.assign(line,{ts1:Number($("ts1").value),price1:Number($("p1").value),ts2:Number($("ts2").value),price2:Number($("p2").value)})})}
    async function recognize(){const button=$("recognize"),requestedTimeframe=$("timeframe").value;button.disabled=true;button.textContent="Codex 读取左上角周期…";box("第一步：Codex 正在读取截图左上角周期标识；确认后才识别趋势线…","info");try{const payload={image_data_url:imageData,role:$("role").value,expected_line_type:$("expected").value,symbol:$("symbol").value.trim().toUpperCase(),timeframe:requestedTimeframe,chart_timezone:$("timezone").value,target_line_hint:$("hint").value.trim()||null,usd_amount:100,mode:"simulate"};const response=await fetch("/ai/line-recognize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await response.json().catch(()=>null);if(!response.ok)throw new Error(data?.detail||`HTTP ${response.status}`);if(!data?.line)throw new Error(data?.notes||"未识别到可用画线");line=data.line;geometry=data.image_geometry;detectedTimeframe=supportedTimeframes.has(data.detected_timeframe)?data.detected_timeframe:null;timeframeMode=requestedTimeframe==="auto"?"auto":"manual";if(detectedTimeframe){$("timeframe").value=detectedTimeframe;setTimeframeState(requestedTimeframe==="auto"?`已自动切换至 ${detectedTimeframe}`:`已确认 · ${detectedTimeframe}`,"ok")};$("confidence").textContent=`周期 ${data.detected_timeframe} · ${Math.round(Number(data.timeframe_confidence)*100)}% / 画线 ${Math.round(Number(data.confidence)*100)}%`;renderEditor();persist();box(`周期校验通过：${data.detected_timeframe}\n${requestedTimeframe==="auto"?`已自动切换 K 线周期到 ${data.detected_timeframe}。`:"手动周期校验通过。"}\n识别完成，可调整参数后打开预览。`,"ok")}catch(error){box(`识别失败：${error.message||error}`,"error")}finally{button.disabled=false;button.textContent="重新校验并识别"}}
    $("drop").onclick=()=>$("file").click();$("drop").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};$("file").onchange=e=>{if(e.target.files[0])accept(e.target.files[0])};$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("drag")};$("drop").ondragleave=()=>$("drop").classList.remove("drag");$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("drag");if(e.dataTransfer.files[0])accept(e.dataTransfer.files[0])};document.onpaste=e=>{const f=Array.from(e.clipboardData?.items||[]).find(x=>x.type.startsWith("image/"))?.getAsFile();if(f)accept(f)};$("recognize").onclick=recognize;$("clear").onclick=()=>location.reload();$("savePreview").onclick=()=>{persist();location.href="/preview"};loadDefaults();
    $("timeframe").onchange=()=>{timeframeMode=$("timeframe").value==="auto"?"auto":"manual";setTimeframeState(timeframeMode==="auto"?(detectedTimeframe?`自动模式 · 当前 ${detectedTimeframe}`:"等待截图左上角周期"):`手动周期 · ${$("timeframe").value}`,timeframeMode==="auto"&&!detectedTimeframe?"warn":"ok");persist();if(imageData)box(timeframeMode==="auto"?"已切换为自动判断周期；下一次识别会读取截图左上角。":"已切换手动周期；识别时将严格校验截图周期。","info")};
  </script>
</body></html>
