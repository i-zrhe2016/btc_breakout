<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC Breakout · K线与趋势线预览</title>
<style>
:root{color-scheme:dark;--bg:#020617;--surface:#0b1120;--surface2:#111827;--border:#334155;--soft:#1e293b;--text:#f8fafc;--muted:#a8b4c7;--cyan:#22d3ee;--cyanSoft:rgba(34,211,238,.12);--green:#22c55e;--red:#f87171;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid rgba(34,211,238,.6);outline-offset:2px}header{min-height:64px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--soft);background:rgba(2,6,23,.9)}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cyan);color:#001014;font-weight:900}.brand small{display:block;color:var(--muted);font-size:12px}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{min-height:44px;padding:8px 13px;display:inline-flex;align-items:center;color:var(--muted);text-decoration:none;border:1px solid var(--soft);border-radius:999px}nav a.active{color:var(--text);border-color:var(--cyan);background:var(--cyanSoft)}main{width:min(1500px,calc(100% - 28px));margin:24px auto 40px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:15px}.eyebrow{color:var(--cyan);font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0;font-size:clamp(25px,3vw,38px)}.hero p{margin:0;color:var(--muted)}.panel{background:linear-gradient(180deg,rgba(17,24,39,.98),rgba(11,17,32,.98));border:1px solid var(--soft);border-radius:14px;overflow:hidden}.toolbar{padding:12px;display:flex;align-items:end;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--soft)}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select{min-height:44px;padding:8px 10px;color:var(--text);background:#050b18;border:1px solid var(--border);border-radius:9px}.field input{width:150px}.spacer{flex:1}.controls{display:flex;gap:8px;flex-wrap:wrap}button{min-height:44px;padding:8px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);cursor:pointer;font-weight:650}button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#001014;border-color:transparent}.badge{display:inline-flex;align-items:center;min-height:30px;padding:4px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px}.badge.warn{color:#fde68a;border-color:rgba(251,191,36,.5)}.chart-wrap{position:relative;height:min(680px,70vh);min-height:430px;background:#02050c;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:grab}canvas.dragging{cursor:grabbing}.legend{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.legend span{padding:5px 8px;background:rgba(2,6,23,.88);border:1px solid var(--soft);border-radius:8px;color:var(--muted);font-size:11px}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);white-space:pre-wrap;pointer-events:none}.hidden{display:none!important}.footer{padding:10px 13px;border-top:1px solid var(--soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.line-list{display:flex;gap:14px;flex-wrap:wrap}.line-list b{color:var(--text);font-family:ui-monospace,monospace}.help{color:var(--muted);font-size:12px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){header{padding:12px 14px;align-items:flex-start}.brand small{display:none}.hero{align-items:flex-start;flex-direction:column}.field{flex:1;min-width:130px}.field input,.field select{width:100%}.spacer{display:none}.controls{width:100%}.controls button{flex:1}.chart-wrap{height:58vh;min-height:400px}}
</style></head><body>
<header><div class="brand"><div class="mark" aria-hidden="true">B</div><div><strong>BTC Breakout</strong><small>Chart Preview</small></div></div><nav aria-label="主导航"><a href="/">策略</a><a href="/recognition">识别参数</a><a class="active" href="/preview">K线预览</a><a href="/settings">通知设置</a></nav></header>
<main><div class="hero"><div><div class="eyebrow">Kline workspace</div><h1>K线与趋势线预览</h1><p>集中查看识别结果；趋势线只绘制 P1–P2 锚点区间，不会向外延长。支持滚轮缩放、拖动平移和键盘/按钮操作。</p></div><a href="/recognition" style="color:var(--cyan)">返回修改识别参数 →</a></div>
<section class="panel"><div class="toolbar"><div class="field"><label for="symbol">交易对</label><input id="symbol" value="BTCUSDT"></div><div class="field"><label for="timeframe">周期</label><select id="timeframe"><option value="auto" selected>自动识别（已确认周期）</option><option>1m</option><option>3m</option><option>5m</option><option>15m</option><option>30m</option><option>1h</option><option>2h</option><option>4h</option><option>6h</option><option>8h</option><option>12h</option><option>1d</option><option>3d</option><option>1w</option></select></div><button id="refresh" class="primary">刷新K线</button><span id="source" class="badge">行情源</span><span id="timeframeState" class="badge">自动周期</span><div class="spacer"></div><div class="controls" aria-label="图表控制"><button id="left" aria-label="向左移动">← 左移</button><button id="right" aria-label="向右移动">右移 →</button><button id="zoomIn" aria-label="放大图表">＋ 放大</button><button id="zoomOut" aria-label="缩小图表">－ 缩小</button><button id="focus" aria-label="定位趋势线锚点">定位锚点</button><button id="reset">全部K线</button></div></div>
<div class="chart-wrap" id="wrap"><canvas id="chart" tabindex="0" role="img" aria-label="K线、入场趋势线与止损趋势线预览。使用左右方向键移动，加减键缩放，0键显示全部K线。"></canvas><div class="legend"><span>青色实线 ENTRY</span><span>红色虚线 STOP</span><span>圆点 P1 / P2 锚点</span></div><div id="empty" class="empty">正在加载 K 线…</div></div>
<div class="footer"><div class="line-list"><span>当前价 <b id="price">--</b></span><span>入场线 <b id="entry">--</b></span><span>止损线 <b id="stop">--</b></span></div><span id="range">--</span><span id="loadedLines">未载入趋势线</span><span class="help">拖动左右移动 · 滚轮缩放 · 双击定位锚点</span></div><div id="summary" class="sr" aria-live="polite"></div></section></main>
<script>
const $=id=>document.getElementById(id),KEY="btcBreakoutRecognitionWorkspace",INTERVAL={"1m":60000,"3m":180000,"5m":300000,"15m":900000,"30m":1800000,"1h":3600000,"2h":7200000,"4h":14400000,"6h":21600000,"8h":28800000,"12h":43200000,"1d":86400000,"3d":259200000,"1w":604800000},DEFAULT_TIMEFRAME="1h";let candles=[],lines={},view={start:0,end:0},drag=null,detectedTimeframe="";
const fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("en-US",{maximumFractionDigits:4}):"--";const time=ts=>new Date(ts).toLocaleString("zh-CN",{hour12:false});
function effectiveTimeframe(){const selected=$("timeframe").value;return selected==="auto"?(INTERVAL[detectedTimeframe]?detectedTimeframe:DEFAULT_TIMEFRAME):selected}
function setTimeframeState(message,kind=""){const el=$("timeframeState");el.textContent=message;el.className=`badge ${kind}`.trim()}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{return{}}}
function normalizeLine(line){if(!line||typeof line!=="object")return null;const kind=String(line.kind||"").toLowerCase();if(kind==="horizontal"){const price=Number(line.price);return Number.isFinite(price)&&price>0?{kind:"horizontal",price}:null}if(kind!=="trendline")return null;let ts1=Number(line.ts1),ts2=Number(line.ts2),price1=Number(line.price1),price2=Number(line.price2);if(Math.abs(ts1)<1e12)ts1*=1000;if(Math.abs(ts2)<1e12)ts2*=1000;if(![ts1,ts2,price1,price2].every(Number.isFinite)||ts1===ts2)return null;if(ts1>ts2)[ts1,ts2,price1,price2]=[ts2,ts1,price2,price1];return{kind:"trendline",ts1,price1,ts2,price2}}
function normalizeLines(raw){const source=raw&&typeof raw==="object"?raw:{};return{entry:normalizeLine(source.entry||source.entry_line),stop:normalizeLine(source.stop||source.stop_line)}}
function trendlines(){return Object.values(lines).filter(x=>x?.kind==="trendline"&&[x.ts1,x.ts2,x.price1,x.price2].every(Number.isFinite))}
function lineAt(line,ts){if(!line||!Number.isFinite(Number(ts)))return null;if(line.kind==="horizontal")return Number(line.price);const ts1=Number(line.ts1),ts2=Number(line.ts2),price1=Number(line.price1),price2=Number(line.price2),span=ts2-ts1;return [ts1,ts2,price1,price2].every(Number.isFinite)&&span?price1+(price2-price1)*((Number(ts)-ts1)/span):null}
function clampView(start,end){if(!candles.length)return;const min=candles[0].ts,max=candles.at(-1).ts,unit=INTERVAL[effectiveTimeframe()]||3600000,minSpan=unit*12,maxSpan=Math.max(minSpan,max-min);let span=Math.max(minSpan,Math.min(maxSpan,end-start));start=Math.max(min,Math.min(max-span,start));view={start,end:start+span}}
function full(){if(candles.length){view={start:candles[0].ts,end:candles.at(-1).ts};draw()}}function pan(factor){const span=view.end-view.start;clampView(view.start+span*factor,view.end+span*factor);draw()}function zoom(factor,center=(view.start+view.end)/2){const span=(view.end-view.start)*factor;clampView(center-span/2,center+span/2);draw()}
function focusAnchors(){const candidates=trendlines();if(!candidates.length)return full();const min=Math.min(...candidates.flatMap(x=>[x.ts1,x.ts2])),max=Math.max(...candidates.flatMap(x=>[x.ts1,x.ts2])),unit=INTERVAL[effectiveTimeframe()]||3600000,pad=Math.max(unit*8,(max-min)*.22);if(!Number.isFinite(min)||!Number.isFinite(max))return full();clampView(min-pad,max+pad);draw()}

function draw(){const canvas=$("chart"),rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const c=canvas.getContext("2d");c.scale(dpr,dpr);const w=rect.width,h=rect.height;c.fillStyle="#02050c";c.fillRect(0,0,w,h);const lineCount=Object.values(lines).filter(Boolean).length;$("loadedLines").textContent=lineCount?`已载入 ${lineCount} 条画线（趋势线仅显示锚点区间）`:"未载入趋势线";if(!candles.length)return;const data=candles.filter(x=>x.ts>=view.start&&x.ts<=view.end);if(!data.length)return;const pad={l:20,r:76,t:42,b:36},start=view.start,end=view.end,visibleLines=[lines.entry,lines.stop].filter(Boolean),values=visibleLines.flatMap(l=>(l.kind==="trendline"?[l.price1,l.price2]:[lineAt(l,start),lineAt(l,end)]).map(Number).filter(Number.isFinite));let min=Math.min(...data.map(x=>x.low),...values),max=Math.max(...data.map(x=>x.high),...values),margin=(max-min||1)*.08;min-=margin;max+=margin;const x=ts=>pad.l+(ts-start)/(end-start||1)*(w-pad.l-pad.r),y=p=>pad.t+(max-p)/(max-min||1)*(h-pad.t-pad.b);c.font="11px ui-monospace,monospace";for(let i=0;i<=5;i++){const yy=pad.t+(h-pad.t-pad.b)*i/5,p=max-(max-min)*i/5;c.strokeStyle="#152033";c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillStyle="#7c8ca3";c.textAlign="right";c.fillText(fmt(p),w-6,yy+4)}const bw=Math.max(1,(w-pad.l-pad.r)/data.length*.68);for(const k of data){const xx=x(k.ts),up=k.close>=k.open;c.strokeStyle=up?"#26a69a":"#ef5350";c.fillStyle=c.strokeStyle;c.beginPath();c.moveTo(xx,y(k.high));c.lineTo(xx,y(k.low));c.stroke();c.fillRect(xx-bw/2,Math.min(y(k.open),y(k.close)),bw,Math.max(1,Math.abs(y(k.open)-y(k.close))))}[["entry","#22d3ee",[]],["stop","#f87171",[8,6]]].forEach(([role,color,dash])=>{const l=lines[role];if(!l)return;let segmentStart=start,segmentEnd=end;if(l.kind==="trendline"){const ts1=Number(l.ts1),ts2=Number(l.ts2);segmentStart=Math.max(start,Math.min(ts1,ts2));segmentEnd=Math.min(end,Math.max(ts1,ts2));if(segmentEnd<=segmentStart)return}const p1=lineAt(l,segmentStart),p2=lineAt(l,segmentEnd);if(![p1,p2].every(Number.isFinite))return;c.strokeStyle=color;c.lineWidth=2.5;c.setLineDash(dash);c.beginPath();c.moveTo(x(segmentStart),y(p1));c.lineTo(x(segmentEnd),y(p2));c.stroke();c.setLineDash([]);c.fillStyle=color;c.textAlign="left";c.fillText(role.toUpperCase(),x(segmentStart)+7,y(p1)-9);if(l.kind==="trendline")[[l.ts1,l.price1,"P1"],[l.ts2,l.price2,"P2"]].forEach(([ts,p,label])=>{ts=Number(ts);p=Number(p);if(ts<start||ts>end)return;c.beginPath();c.arc(x(ts),y(p),6,0,Math.PI*2);c.fill();c.fillText(label,x(ts)+9,y(p)-8)})});const now=Date.now();$("price").textContent=fmt(data.at(-1).close);$("entry").textContent=fmt(lineAt(lines.entry,now));$("stop").textContent=fmt(lineAt(lines.stop,now));$("range").textContent=`${time(start)} — ${time(end)} · ${data.length} 根`;$("summary").textContent=`当前显示 ${data.length} 根 K 线，${lines.entry?"包含入场线":"无入场线"}，${lines.stop?"包含止损线":"无止损线"}`}
const canvas=$("chart");canvas.onpointerdown=e=>{drag={x:e.clientX,start:view.start,end:view.end};canvas.setPointerCapture(e.pointerId);canvas.classList.add("dragging")};canvas.onpointermove=e=>{if(!drag)return;const rect=canvas.getBoundingClientRect(),shift=-(e.clientX-drag.x)/Math.max(1,rect.width-96)*(drag.end-drag.start);clampView(drag.start+shift,drag.end+shift);draw()};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;canvas.classList.remove("dragging")};canvas.onwheel=e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),center=view.start+(view.end-view.start)*ratio;zoom(e.deltaY>0?1.22:.82,center)};canvas.ondblclick=focusAnchors;canvas.onkeydown=e=>{if(e.key==="ArrowLeft")pan(-.15);else if(e.key==="ArrowRight")pan(.15);else if(e.key==="+"||e.key==="=")zoom(.8);else if(e.key==="-")zoom(1.25);else if(e.key==="0")full();else return;e.preventDefault()};$("left").onclick=()=>pan(-.15);$("right").onclick=()=>pan(.15);$("zoomIn").onclick=()=>zoom(.8);$("zoomOut").onclick=()=>zoom(1.25);$("focus").onclick=focusAnchors;$("reset").onclick=full;$("refresh").onclick=()=>{const s=saved();s.symbol=$("symbol").value.trim().toUpperCase();s.timeframe=$("timeframe").value;localStorage.setItem(KEY,JSON.stringify(s));load()};new ResizeObserver(draw).observe($("wrap"));addEventListener("storage",load);load();
async function load(){const state=saved();if(state.symbol)$("symbol").value=state.symbol;detectedTimeframe=INTERVAL[state.detected_timeframe]?state.detected_timeframe:INTERVAL[state.detectedTimeframe]?state.detectedTimeframe:INTERVAL[state.timeframe]?state.timeframe:"";if(state.timeframe_mode==="auto"&&detectedTimeframe)$("timeframe").value="auto";else if(INTERVAL[state.timeframe])$("timeframe").value=state.timeframe;const selected=$("timeframe").value, timeframe=effectiveTimeframe();setTimeframeState(selected==="auto"?(detectedTimeframe?`自动周期 · ${timeframe}`:"自动周期 · 等待识别"):`手动周期 · ${timeframe}`,selected==="auto"&&!detectedTimeframe?"warn":"ok");lines=normalizeLines(state.lines||state);$("empty").classList.remove("hidden");$("empty").textContent=`正在加载 ${timeframe} K 线…`;$("refresh").disabled=true;try{let params=new URLSearchParams({symbol:$("symbol").value.trim().toUpperCase(),timeframe,limit:"500"});const trends=trendlines();if(trends.length){const lo=Math.min(...trends.flatMap(x=>[x.ts1,x.ts2])),hi=Math.max(...trends.flatMap(x=>[x.ts1,x.ts2])),pad=Math.max((hi-lo)*.5,(INTERVAL[timeframe]||3600000)*40);params.set("start_time",String(Math.floor(lo-pad)));params.set("end_time",String(Math.ceil(hi+pad)))}const response=await fetch(`/market/klines?${params}`),data=await response.json().catch(()=>null);if(!response.ok)throw new Error(data?.detail||`HTTP ${response.status}`);if(!Array.isArray(data)||!data.length)throw new Error("行情源返回空数据");candles=data;const fallback=data[0].source==="binance_spot_fallback";$("source").textContent=fallback?"SPOT 参考源":"FUTURES";$("source").className=`badge ${fallback?"warn":""}`;$("empty").classList.add("hidden");full();if(trends.length)focusAnchors()}catch(e){candles=[];$("empty").textContent=`K线加载失败\n${e.message||e}\n请点击刷新重试`;draw()}finally{$("refresh").disabled=false}}
$("timeframe").onchange=()=>{const selected=$("timeframe").value;const state=saved();state.timeframe=selected==="auto"?(detectedTimeframe||state.timeframe||DEFAULT_TIMEFRAME):selected;state.timeframe_mode=selected==="auto"?"auto":"manual";if(detectedTimeframe)state.detected_timeframe=detectedTimeframe;localStorage.setItem(KEY,JSON.stringify(state));load()};
</script></body></html>
