<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Breakout · 通知设置</title>
  <style>
    :root { color-scheme: dark; --bg:#020617; --surface:#0b1120; --surface2:#111827; --border:#334155; --soft:#1e293b; --text:#f8fafc; --muted:#a8b4c7; --cyan:#22d3ee; --cyanSoft:rgba(34,211,238,.12); --green:#22c55e; --greenSoft:rgba(34,197,94,.12); --red:#f87171; --redSoft:rgba(248,113,113,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100dvh; background:radial-gradient(circle at 20% -10%,rgba(34,211,238,.08),transparent 32%),var(--bg); color:var(--text); font:16px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif; }
    button,input { font:inherit; }
    a:focus-visible,button:focus-visible,input:focus-visible { outline:3px solid rgba(34,211,238,.6); outline-offset:2px; }
    .topbar { min-height:64px; padding:10px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--soft); background:rgba(2,6,23,.88); backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--cyan); color:#001014; font-weight:900; }
    .brand strong,.brand small { display:block; } .brand small { color:var(--muted); font-size:12px; }
    nav { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    nav a { color:var(--muted); text-decoration:none; border:1px solid var(--soft); border-radius:999px; padding:8px 13px; min-height:44px; display:inline-flex; align-items:center; }
    nav a.active { color:var(--text); border-color:var(--cyan); background:var(--cyanSoft); }
    main { width:min(760px,calc(100% - 28px)); margin:42px auto; }
    .eyebrow { color:var(--cyan); font:600 12px/1.4 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:5px 0 8px; font-size:clamp(26px,5vw,40px); } .intro { color:var(--muted); margin:0 0 24px; max-width:680px; }
    .panel { background:linear-gradient(180deg,rgba(17,24,39,.98),rgba(11,17,32,.98)); border:1px solid var(--soft); border-radius:14px; box-shadow:0 16px 50px rgba(0,0,0,.28); overflow:hidden; }
    .panel-head { padding:17px 18px 13px; border-bottom:1px solid var(--soft); } .panel-head h2 { margin:0; font-size:17px; } .panel-head p { margin:3px 0 0; color:var(--muted); font-size:13px; }
    form { padding:18px; display:grid; gap:16px; }
    label { display:block; color:var(--muted); font-size:13px; margin-bottom:6px; }
    input[type="url"] { width:100%; min-height:46px; padding:10px 12px; color:var(--text); background:#050b18; border:1px solid var(--border); border-radius:9px; }
    .hint { color:var(--muted); font-size:12px; margin:7px 0 0; overflow-wrap:anywhere; }
    .toggle { display:flex; align-items:flex-start; gap:11px; padding:12px; margin:0; border:1px solid var(--border); border-radius:10px; cursor:pointer; color:var(--text); }
    .toggle input { width:20px; height:20px; margin:2px 0 0; accent-color:var(--cyan); flex:0 0 auto; }
    .toggle span { display:block; } .toggle small { display:block; color:var(--muted); margin-top:2px; }
    .event-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; padding-top:2px; }
    button { min-height:44px; padding:9px 15px; border-radius:9px; border:1px solid var(--border); cursor:pointer; font-weight:650; }
    button.primary { color:#001014; background:var(--cyan); border-color:transparent; } button.secondary { color:var(--text); background:var(--surface2); } button:disabled { opacity:.5; cursor:not-allowed; }
    .status { min-height:44px; padding:10px 12px; border:1px solid var(--soft); border-radius:9px; color:var(--muted); white-space:pre-wrap; }
    .status:empty { display:none; } .status.ok { color:#bbf7d0; border-color:rgba(34,197,94,.5); background:var(--greenSoft); } .status.error { color:#fecaca; border-color:rgba(248,113,113,.5); background:var(--redSoft); }
    @media(max-width:620px) { .topbar { padding:12px 14px; align-items:flex-start; } .brand small { display:none; } nav a { padding:7px 10px; } main { margin:28px auto; } .event-grid { grid-template-columns:1fr; } .actions button { width:100%; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true">B</div><div><strong>BTC Breakout</strong><small>Notification Center</small></div></div>
    <nav aria-label="主导航"><a href="/">双线策略</a><a class="active" href="/settings">通知设置</a><a href="/manual">手动画线</a><a href="/ai">单图识别</a></nav>
  </header>
  <main>
    <div class="eyebrow">Notifications</div>
    <h1>Bark 开平仓通知</h1>
    <p class="intro">在这里统一配置 Bark。策略实际开仓和完成平仓后，服务端会按选择发送通知；网页关闭后仍然有效。</p>
    <section class="panel" aria-labelledby="barkTitle">
      <div class="panel-head"><h2 id="barkTitle">Bark 配置</h2><p>配置保存在策略数据库中，重启后继续生效。</p></div>
      <form id="form">
        <div><label for="endpoint">Bark 地址</label><input id="endpoint" type="url" autocomplete="off" spellcheck="false" placeholder="https://api.day.app/你的设备Key/" /><p class="hint">支持官方 api.day.app 或兼容 Bark 的自托管 http(s) 地址。</p></div>
        <label class="toggle" for="enabled"><input id="enabled" type="checkbox" /><span><strong>启用策略通知</strong><small>总开关关闭时不会发送任何开平仓消息。</small></span></label>
        <div class="event-grid">
          <label class="toggle" for="notifyOpen"><input id="notifyOpen" type="checkbox" /><span><strong>开仓通知</strong><small>市价入场成交后发送</small></span></label>
          <label class="toggle" for="notifyClose"><input id="notifyClose" type="checkbox" /><span><strong>平仓通知</strong><small>止损或手动平仓完成后发送</small></span></label>
        </div>
        <div class="actions"><button id="save" class="primary" type="submit">保存设置</button><button id="test" class="secondary" type="button">发送测试通知</button></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const payload = () => ({ endpoint: byId("endpoint").value.trim(), enabled: byId("enabled").checked, notify_on_open: byId("notifyOpen").checked, notify_on_close: byId("notifyClose").checked });
    const status = (message, kind = "") => { byId("status").textContent = message; byId("status").className = `status ${kind}`.trim(); };
    async function readJson(response) { const result = await response.json().catch(() => null); if (!response.ok) throw new Error(result?.detail || `HTTP ${response.status}`); return result; }
    async function load() {
      status("正在读取配置…");
      try { const data = await readJson(await fetch("/settings/bark")); byId("endpoint").value = data.endpoint || ""; byId("enabled").checked = Boolean(data.enabled); byId("notifyOpen").checked = Boolean(data.notify_on_open); byId("notifyClose").checked = Boolean(data.notify_on_close); status("配置已加载。", "ok"); }
      catch (error) { status(`读取失败：${error.message || error}`, "error"); }
    }
    byId("form").addEventListener("submit", async (event) => {
      event.preventDefault(); const button = byId("save"); button.disabled = true; button.textContent = "保存中…"; status("正在保存配置…");
      try { await readJson(await fetch("/settings/bark", { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload()) })); status("设置已保存，后续策略开平仓将使用此配置。", "ok"); }
      catch (error) { status(`保存失败：${error.message || error}`, "error"); }
      finally { button.disabled = false; button.textContent = "保存设置"; }
    });
    byId("test").addEventListener("click", async () => {
      const button = byId("test"); button.disabled = true; button.textContent = "发送中…"; status("正在发送测试通知…");
      try { await readJson(await fetch("/settings/bark/test", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload()) })); status("测试通知已发送，请检查 Bark 设备。", "ok"); }
      catch (error) { status(`测试失败：${error.message || error}`, "error"); }
      finally { button.disabled = false; button.textContent = "发送测试通知"; }
    });
    load();
  </script>
</body>
</html>
