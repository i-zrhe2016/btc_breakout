services:
  api:
    build: .
    container_name: btc_breakout_api
    ports:
      - "8000:8000"
    environment:
      - BINANCE_BASE_URL=${BINANCE_BASE_URL:-https://api.binance.us}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BARK_NOTIFY_URL=${BARK_NOTIFY_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
